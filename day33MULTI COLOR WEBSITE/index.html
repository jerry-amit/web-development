    <style>
    :root{
        --color:rgb(73, 5, 243);
        --seccolor:rgb(255, 0, 247);
        --defpad:3px 45px;
        --defmar:3px 0;
        --defop:0.5;
    }


        *{
            margin: 0;
            padding: 0;
        }

        .nav{
            color: var(--seccolor);
            opacity: var();
        }

        ul{
            background-color: var(--color);
            display: flex;
            padding: var(--defpad);
            margin: var(--defmar);
            list-style: none;
            
            
        }

        ul li{
            padding: var(--defpad);
        cursor:default;    
        
    }

    .conatainer{
        --color: var(--color);
    }

    
       ul li:first-child{
