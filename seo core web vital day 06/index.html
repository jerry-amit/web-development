<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS LETS LEARN IT</title>
    <script src="script.js"></script>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <h1>form to apply for TA</h1>
    <form action="post">
        <div>
        <label for="username"> Enter your username</label>
<input type="text" id="username" name="username"
placeholder="Enter your Username">
</div>
<div>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>
<input type="radio" id="female " name="gender" value="female">
<label for="female">Female</label>
<input type="radio" id="transgender" name="transgender" value="transgender">
<label for="transgender">Transgender</label>
</div>

<div>

    <input type="checkbox" id="subscribe" name="subscribe" value="yes">
    <label for="checkbox">Subscribe to newsletter</label>
</div>
<div>
   <label for="comment">Enter your comments</label>
   <br>
    <textarea name="comment" rows="20" cols="50" >Enter your comments here...
    </textarea>
</div>

<div>
    <select name="fruits">

        <option value="apple">APPLE</option>
        <option value="banana">BANANA</option>
        <option value="cherry">CHERRY</option>
        <option value="ya jerry">YA JERRY</option>
   </select>
</div>
    </form>
</body>
</html>
