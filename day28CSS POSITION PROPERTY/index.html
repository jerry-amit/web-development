<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS POSITION PROPERTY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }

        .box1 {
     position: absolute;
        top: 0px;
        left: 3px;
            /*z-index:0;*/
          /*  position: sticky;
            top: 0px;
            height: 111px;
            width: 100%;
            margin: 0px;
            padding: 0px;*/
            background-color: aqua;
        }

        .box2 {
            background-color: blue;
            /* position: relative;*/
            /*  top: -16px;*/
            /* top: 34px;
       left: 34px;*/
            /* bottom: 56px;*/
        }

        .box3 {
            background-color: blueviolet;
         /*   position: fixed;
            bottom: 0px;
            left: 8vw;
            height: 111px;*/
        }

        .box4 {
            background-color: brown;
        }


        .parent {
            padding: 43px;
            margin: 34px;
            border: 2px solid purple;
          /* position: sticky;*/
          transform: translate(0); /*works same as position*/
          /* to invert the color and works like absolute*/
          /*filter: invert();*/

          /*works like absolute*/
          perspective: 0em;

        }
    </style>

</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
