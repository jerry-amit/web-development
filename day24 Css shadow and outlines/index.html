<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS SHADOW AND OUTLINE</title>
<style>
    .box{
        border: 2px solid black;
        padding: 34px;

         box-shadow: 5px 15px 5px #888888;
    }

    .text-element {
        text-shadow: 2px 2px 4px #ec0d71 ;
        outline: 2px solid black;
        border: 2px solid green;
        outline-offset: 31px ;
        border-radius: 10px;
    }

</style>

</head>
<body>
    
    <div class="box">
        i am a box
    </div>

    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Nobis veniam excepturi nam numquam debitis tenetur. Reiciendis maiores maxime facilis similique, suscipit officia consequatur, atque et soluta dolore dicta recusandae molestiae, corporis alias debitis excepturi?
    </p>
</body>
</html>
