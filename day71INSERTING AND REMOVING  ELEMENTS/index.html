<body>

        <div class=" box" style="display:flex" data-createdby = "jerry" data-conceptby="Rohan" >Hey i am a box</div>
        <div class="box">Hey i am a box</div>
 
    <script>

      /*  let div = document.createElement("div");

        let cont = document.querySelector(".container")
        cont.insertAdjacentHTML("afterbegin","<b> i Am under the water ....</b>")
        cont.insertAdjacentHTML("afterend","<b> i Am under the water ....</b>")
        cont.insertAdjacentHTML("beforebegin","<b> i Am under the water ....</b>")
        cont.insertAdjacentHTML("beforeend","<b> i Am under the water ....</b>")


        document.querySelector(".box").remove()
        document.querySelector(".container").classList
        document.querySelector(".container").className
        document.querySelector(".container").classList.add("Jerry")
        document.querySelector(".container").classList.remove("Jerry")
        document.querySelector(".container").classList.toggle("red")
