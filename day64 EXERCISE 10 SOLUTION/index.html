<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercice 10 solution</title>
</head>

<body>
    <script>
        let rand = Math.random()
        let first, second, third
        //lets generate the first word
        console.log(rand)
        if (rand < 0.33) {
            first = "crazy"
        }
        else if (rand < 0.66 && rand >= 0.33) {
            first = "Amazing"
        }
        else {
            first = "Fire"
        }

        // lets generate the second word
        rand = Math.random()
        console.log(rand)
        if (rand < 0.33) {
            second = "Engine"
        }
        else if (rand < 0.66 && rand >= 0.33) {
            second = "Foods"
        }
        else {
            second = "Garments"
        }

        // lets generate the third word
        rand = Math.random()
        console.log(rand)
        if (rand < 0.33) {
            third = "Bros"
        }
        else if (rand < 0.66 && rand >= 0.33) {
            third = "Limited"
        }
        else {
            third = "Hub"
        }

        console.log(`${first} ${second} ${third}`)

    </script>
</body>

</html>
