<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS TRANSITIONS </title>
    <style>
        .container{
            background-color: antiquewhite;
            width: 50vw;
            height: 40vh;
        }

    .box{
        background-color: aquamarine;
              width: 5vw;
            height: 4vh;
            /* transition-property: transform;
            transition-duration: 3s;
            transition-timing-function: cubic-bezier(0.29, 0.63, 0.55, 0.65);
            transition-delay: 1s; */
/* shorthand*/
            transition: all 8s cubic-bezier(0,-0.11, 0.46, 1.46) 1s;
    }
    .translate{
        transform: translateX(10vw) translateY(10vh) scale(3);
        background-color: blue;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="box translate"></div>
    </div>
</body>
</html>
