<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS FILTERS</title>
    <style>
        img {
           /* filter: blur(10px);*/
        }

        .img1 {
            filter: brightness(122%);
        }



        .img2 {
            filter: blur() brightness() opacity() invert() contrast() drop-shadow(10px 10px 10px red  );
        }



        .img3 {
            filter: grayscale(20%);
        }
    </style>
</head>

<body>

    <div class="conatiner">
        <img class="img1" src="image.jpg" alt="">
        <img class="img2" src="https://www.thestatesman.com/wp-content/uploads/2019/06/srk-2.jpg" alt="">
        <img class="img3"
            src="https://www.livemint.com/lm-img/img/2025/01/22/600x338/PTI01-20-2025-000231A-0_1737546662225_1737546690718.jpg"
            alt="">
    </div>
</body>

</html>
